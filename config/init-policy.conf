# =============================================================
# init-policy.conf — recommendation policy for `lm init` fallback only
# =============================================================
# This is NOT an install SSOT (that remains config/*.manifest).
# It is NOT used by `lm update` / `lm get` (those read update-policy.conf).
# When a Mac SKU is missing from hardware-profiles.tsv, lm init scores
# remote Ollama tags with RAM-scaled windows (so 128GB is not capped at 48GB).
# =============================================================

# Preferred families to scan for tier recommendations (priority order)
FAMILIES=qwen3.8,qwen3.6,qwen3.5

WATCH_FAMILIES=ornith,laguna-xs-2.1,gemma4,qwen3-embedding,gpt-oss,devstral

# Support-role family lists (fallback only)
EMBED_FAMILIES=qwen3-embedding
CHAT_FAMILIES=gemma4
REASON_FAMILIES=gpt-oss
RERANK_FAMILIES=awenleven/Qwen3-Reranker-4B

EXCLUDE_TAG_SUBSTR=mlx,bf16,cloud
STABILITY_MARGIN=4
FAMILY_PRIORITY_WEIGHT=12

MAIN_QUANT_PREFER=q4_K_M,q4_K_S,q5_K_M,nvfp4,mxfp8,q8_0
DEEP_QUANT_PREFER=q8_0,q6_K,q5_K_M,q4_K_M
FAST_QUANT_PREFER=q4_K_M,q4_0,q4_K_S

MAIN_PREFER_MOE=1
DEEP_PREFER_DENSE=1
PREFER_VISION=1
PREFER_TOOLS=1

# Default reserve; scaled_init_policy() may lower this on small RAM
RESERVE_GB=12
RESERVE_GB_16=6
RESERVE_GB_24=8

# Scale *_ABS_MAX to usable RAM so large Macs are not stuck at 48GB caps
SCALE_ABS_WITH_RAM=1

MAIN_FRAC_MIN=0.35
MAIN_FRAC_MAX=0.72
DEEP_FRAC_MIN=0.50
DEEP_FRAC_MAX=0.95
FAST_FRAC_MIN=0.05
FAST_FRAC_MAX=0.28
EMBED_FRAC_MIN=0.02
EMBED_FRAC_MAX=0.25
CHAT_FRAC_MIN=0.25
CHAT_FRAC_MAX=0.70
REASON_FRAC_MIN=0.20
REASON_FRAC_MAX=0.70
RERANK_FRAC_MIN=0.02
RERANK_FRAC_MAX=0.20

# Soft ceilings so "fast" does not become a 30GB model on 128GB machines
FAST_ABS_CEIL=10
EMBED_ABS_CEIL=8
RERANK_ABS_CEIL=6
CHAT_ABS_CEIL=36
REASON_ABS_CEIL=80
MAIN_ABS_CEIL=80
DEEP_ABS_CEIL=90

MAIN_NUM_CTX=65536
DEEP_NUM_CTX=32768
FAST_NUM_CTX=32768
EMBED_NUM_CTX=8192
CHAT_NUM_CTX=65536
REASON_NUM_CTX=65536
RERANK_NUM_CTX=8192

# RAM bucket → lineup id for image/asr/tts when LLM scoring is used (offline)
RAM_BAND_LINEUPS=8:lite-16,16:lite-16,18:lite-16,24:std-24,32:std-32,36:std-36,48:full-48,64:plus-64,96:ultra-128,128:ultra-128,192:ultra-128

OLLAMA_LIBRARY_BASE=https://ollama.com
OLLAMA_REGISTRY_BASE=https://registry.ollama.ai
