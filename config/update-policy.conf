# =============================================================
# update-policy.conf — recommendation policy for `lm update` / `lm get`
# =============================================================
# This is NOT an install SSOT (that remains config/models.manifest).
# It only guides remote discovery + hardware-aware tier scoring.
# Model names are discovered from ollama.com; do not treat this as a pin list.
# =============================================================

# Preferred families to scan for tier recommendations (priority order)
FAMILIES=qwen3.8,qwen3.6,qwen3.5

# Lower-priority watch families (considered only if they beat preferred fits)
WATCH_FAMILIES=ornith,laguna-xs-2.1,gemma4,qwen3-embedding,gpt-oss,devstral

# Tag substrings to exclude from auto-pick (comma-separated, case-insensitive)
# mlx: some builds advertise vision but fail image input on this stack
# bf16: usually exceeds 48GB usable budget
EXCLUDE_TAG_SUBSTR=mlx,bf16,cloud

# Keep current tier tag unless a challenger beats it by this score margin
STABILITY_MARGIN=4

# Score penalty per position in FAMILIES + WATCH_FAMILIES order.
# Keep it above the MoE/dense bonuses below, or an older generation can win on
# shape alone (qwen3.6 MoE outscoring qwen3.8 dense for main).
FAMILY_PRIORITY_WEIGHT=12

# Soft preference order for quant / variant tokens (left = better)
MAIN_QUANT_PREFER=q4_K_M,q4_K_S,q5_K_M,nvfp4,mxfp8,q8_0
DEEP_QUANT_PREFER=q8_0,q6_K,q5_K_M,q4_K_M
FAST_QUANT_PREFER=q4_K_M,q4_0,q4_K_S

# Prefer MoE (a3b / a4b style) for main; prefer denser (no MoE token) for deep
MAIN_PREFER_MOE=1
DEEP_PREFER_DENSE=1

# Prefer native vision + tools when the library page advertises them
PREFER_VISION=1
PREFER_TOOLS=1

# System RAM reserve for OS / IDE / browser (GB). Usable = mem_gb - RESERVE_GB
RESERVE_GB=12

# Tier size windows as fractions of usable RAM (min,max), plus absolute caps (GB)
# main: daily driver — mid-size, leaves headroom for KV + light image-gen
MAIN_FRAC_MIN=0.35
MAIN_FRAC_MAX=0.72
MAIN_ABS_MAX=28

# deep: quality — can use most of the usable budget
DEEP_FRAC_MIN=0.50
DEEP_FRAC_MAX=0.95
DEEP_ABS_MAX=36

# fast: speed — small models only
FAST_FRAC_MIN=0.05
FAST_FRAC_MAX=0.28
FAST_ABS_MAX=10

# Default num_ctx written into models.manifest when a tier changes
MAIN_NUM_CTX=65536
DEEP_NUM_CTX=32768
FAST_NUM_CTX=32768
EMBED_NUM_CTX=8192
CHAT_NUM_CTX=65536

# Ollama library base URL (override only for mirrors / debugging)
OLLAMA_LIBRARY_BASE=https://ollama.com
OLLAMA_REGISTRY_BASE=https://registry.ollama.ai
